<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LekhIkA - AI Copy Alchemist</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-glass: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --accent-primary: #00d4ff;
            --accent-secondary: #ff6b35;
            --accent-success: #00ff88;
            --accent-warning: #ffaa00;
            --accent-error: #ff4757;
            --border-primary: rgba(255, 255, 255, 0.1);
            --border-secondary: rgba(255, 255, 255, 0.05);
            --shadow-primary: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-secondary: 0 4px 16px rgba(0, 0, 0, 0.2);
            --gradient-primary: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            --gradient-secondary: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
            --gradient-success: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 107, 53, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0, 255, 136, 0.05) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-10px, -10px) rotate(1deg); }
            66% { transform: translate(10px, -5px) rotate(-1deg); }
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: particleFloat 15s linear infinite;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 2s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 4s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 6s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 8s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 10s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 12s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 14s; }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 2px;
            background: var(--gradient-primary);
            border-radius: 1px;
        }

        .header h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.3)); }
            50% { filter: drop-shadow(0 0 40px rgba(0, 212, 255, 0.6)); }
        }

        .header p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Main Content */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 60px;
        }

        /* Glass Cards */
        .glass-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-primary);
            border-radius: 24px;
            padding: 40px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .glass-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-primary);
            border-color: var(--accent-primary);
        }

        .glass-card:hover::before {
            opacity: 1;
        }

        .glass-card h2 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 30px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .glass-card h2::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--gradient-primary);
            border-radius: 2px;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 16px 20px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-secondary);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.1);
            background: var(--bg-secondary);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--text-muted);
        }

        .word-count {
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 8px;
            font-weight: 500;
        }

        /* Buttons */
        .btn {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            margin-right: 12px;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--gradient-secondary);
        }

        .btn-secondary:hover {
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.3);
        }

        .btn-success {
            background: var(--gradient-success);
        }

        .btn-success:hover {
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.3);
        }

        /* Humanize Options */
        .humanize-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        .humanize-option {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-secondary);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .humanize-option::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .humanize-option:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-secondary);
        }

        .humanize-option:hover::before {
            opacity: 0.1;
        }

        .humanize-option.selected {
            border-color: var(--accent-primary);
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .humanize-option h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .humanize-option p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Loading Animation */
        .loading {
            display: none;
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 3px solid var(--border-secondary);
            border-top: 3px solid var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Results Section */
        .results-section {
            grid-column: 1 / -1;
        }

        .score-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--accent-primary) 0deg, var(--accent-primary) 0deg, var(--border-secondary) 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 40px;
            position: relative;
            animation: scorePulse 2s ease-in-out infinite;
        }

        @keyframes scorePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .score-circle::before {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 2px solid var(--border-primary);
        }

        .score-text {
            position: relative;
            z-index: 1;
            font-size: 3rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Parameters Grid */
        .parameters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .parameter-card {
            background: var(--bg-card);
            border: 1px solid var(--border-secondary);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .parameter-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gradient-primary);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .parameter-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-secondary);
        }

        .parameter-card:hover::before {
            transform: scaleX(1);
        }

        .parameter-name {
            font-size: 0.9rem;
            margin-bottom: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .parameter-score {
            font-size: 2rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* AI Insights */
        .ai-insights {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 20px;
            padding: 30px;
            margin: 30px 0;
            position: relative;
            overflow: hidden;
        }

        .ai-insights::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--gradient-primary);
        }

        .ai-insights h3 {
            margin-bottom: 20px;
            color: var(--accent-primary);
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-insights p {
            line-height: 1.7;
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Word Suggestions */
        .word-suggestions {
            margin-top: 40px;
        }

        .word-suggestions h3 {
            font-size: 1.6rem;
            margin-bottom: 30px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .suggestion-item {
            background: var(--bg-card);
            border: 1px solid var(--border-secondary);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .suggestion-item:hover {
            transform: translateX(8px);
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-secondary);
        }

        .suggestion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .suggestion-category {
            background: var(--gradient-primary);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .suggestion-impact {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .suggestion-content {
            margin-bottom: 12px;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .original-word {
            color: var(--accent-error);
            font-weight: 600;
        }

        .suggested-words {
            color: var(--accent-success);
            font-weight: 600;
        }

        .suggestion-reason {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .suggestion-actions {
            display: flex;
            gap: 12px;
        }

        .btn-small {
            padding: 10px 20px;
            font-size: 0.9rem;
        }

        /* Error Messages */
        .error-message {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid var(--accent-error);
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            color: var(--accent-error);
        }

        .error-message h3 {
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .error-message p {
            line-height: 1.6;
            color: var(--text-secondary);
        }

        /* Humanize Section */
        .humanize-section {
            grid-column: 1 / -1;
            margin-top: 40px;
        }

        .humanized-text {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            position: relative;
        }

        .humanized-text h3 {
            margin-bottom: 20px;
            color: var(--accent-success);
            font-size: 1.4rem;
            font-weight: 600;
        }

        .humanized-text p {
            line-height: 1.8;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .humanize-improvements {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 20px;
            padding: 30px;
        }

        .humanize-improvements h3 {
            margin-bottom: 20px;
            color: var(--accent-warning);
            font-size: 1.4rem;
            font-weight: 600;
        }

        .humanize-improvements ul {
            list-style: none;
            padding: 0;
        }

        .humanize-improvements li {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-secondary);
            color: var(--text-secondary);
            position: relative;
            padding-left: 24px;
        }

        .humanize-improvements li::before {
            content: '→';
            position: absolute;
            left: 0;
            color: var(--accent-warning);
            font-weight: bold;
        }

        .humanize-improvements li:last-child {
            border-bottom: none;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .header h1 {
                font-size: 3rem;
            }

            .parameters-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header h1 {
                font-size: 2.5rem;
            }

            .glass-card {
                padding: 30px 20px;
            }

            .humanize-options {
                grid-template-columns: 1fr;
            }

            .parameters-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 15px;
            }

            .score-circle {
                width: 150px;
                height: 150px;
            }

            .score-circle::before {
                width: 120px;
                height: 120px;
            }

            .score-text {
                font-size: 2.5rem;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-secondary);
        }
    </style>
</head>
<body>
    <div class="animated-bg"></div>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    
    <div class="container">
        <div class="header">
            <h1>🚀 LekhIkA</h1>
            <p>AI-Powered Copy Analysis & Humanization Platform</p>
        </div>

        <div class="main-content">
            <div class="glass-card input-section">
                <h2>📝 Enter Your Copy</h2>
                
                <div class="form-group">
                    <label for="copyText">Copy Text</label>
                    <textarea id="copyText" rows="8" placeholder="Paste your copy here..."></textarea>
                    <div class="word-count" id="wordCount">0 words</div>
                </div>

                <div class="form-group">
                    <label for="copyType">Copy Type</label>
                    <select id="copyType">
                        <option value="general">General</option>
                        <option value="email">Email Marketing</option>
                        <option value="sales">Sales Page</option>
                        <option value="social">Social Media</option>
                        <option value="landing">Landing Page</option>
                        <option value="blog">Blog Post</option>
                        <option value="ad">Advertisement</option>
                        <option value="product">Product Description</option>
                    </select>
                </div>

                <button class="btn" onclick="analyzeCopy()">
                    <span>🔍</span>
                    Analyze Copy
                </button>
                <button class="btn btn-secondary" onclick="clearAll()">
                    <span>🗑️</span>
                    Clear
                </button>
            </div>

            <div class="glass-card">
                <h2>🎯 Quick Actions</h2>
                
                <div class="humanize-options">
                    <div class="humanize-option" onclick="selectTone('professional')">
                        <h3>👔 Professional</h3>
                        <p>Business-like tone</p>
                    </div>
                    <div class="humanize-option" onclick="selectTone('casual')">
                        <h3>😊 Casual</h3>
                        <p>Friendly & relaxed</p>
                    </div>
                    <div class="humanize-option" onclick="selectTone('friendly')">
                        <h3>🤝 Friendly</h3>
                        <p>Warm & approachable</p>
                    </div>
                    <div class="humanize-option" onclick="selectTone('urgent')">
                        <h3>⚡ Urgent</h3>
                        <p>Time-sensitive</p>
                    </div>
                </div>

                <button class="btn btn-success" onclick="humanizeCopy()">
                    <span>✨</span>
                    Humanize Copy
                </button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing your copy...</p>
        </div>

        <div class="glass-card results-section" id="results" style="display: none;">
            <h2>📊 Analysis Results</h2>
            
            <div class="score-circle" id="scoreCircle">
                <div class="score-text" id="scoreText">0</div>
            </div>

            <div class="parameters-grid" id="parametersGrid"></div>

            <div class="ai-insights" id="aiInsights"></div>

            <div class="word-suggestions" id="wordSuggestions"></div>

            <div class="humanize-section" id="humanizeSection" style="display: none;">
                <div class="humanized-text" id="humanizedText"></div>
                <div class="humanize-improvements" id="humanizeImprovements"></div>
            </div>
        </div>
    </div>

    <script>
        let selectedTone = 'professional';
        let currentAnalysis = null;

        // Word count update with animation
        document.getElementById('copyText').addEventListener('input', function() {
            const words = this.value.trim().split(/\s+/).filter(word => word.length > 0);
            const wordCount = document.getElementById('wordCount');
            const currentCount = parseInt(wordCount.textContent);
            const newCount = words.length;
            
            // Animate count change
            if (currentCount !== newCount) {
                wordCount.style.transform = 'scale(1.1)';
                wordCount.style.color = '#00d4ff';
                setTimeout(() => {
                    wordCount.style.transform = 'scale(1)';
                    wordCount.style.color = '#666666';
                }, 200);
            }
            
            wordCount.textContent = `${newCount} words`;
        });

        // Tone selection with animation
        function selectTone(tone) {
            selectedTone = tone;
            document.querySelectorAll('.humanize-option').forEach(option => {
                option.classList.remove('selected');
            });
            event.target.closest('.humanize-option').classList.add('selected');
            
            // Add ripple effect
            const ripple = document.createElement('div');
            ripple.style.position = 'absolute';
            ripple.style.borderRadius = '50%';
            ripple.style.background = 'rgba(0, 212, 255, 0.3)';
            ripple.style.transform = 'scale(0)';
            ripple.style.animation = 'ripple 0.6s linear';
            ripple.style.left = '50%';
            ripple.style.top = '50%';
            ripple.style.width = '100px';
            ripple.style.height = '100px';
            ripple.style.marginLeft = '-50px';
            ripple.style.marginTop = '-50px';
            
            event.target.closest('.humanize-option').appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        // Add ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Analyze copy with proper error handling
        async function analyzeCopy() {
            const copyText = document.getElementById('copyText').value.trim();
            const copyType = document.getElementById('copyType').value;

            if (!copyText) {
                showError('Please enter some copy to analyze');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ copyText, copyType })
                });

                // Handle non-JSON responses
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    throw new Error(`Server error: ${text.substring(0, 200)}`);
                }

                const data = await response.json();

                if (data.success) {
                    currentAnalysis = data;
                    displayResults(data);
                } else {
                    throw new Error(data.error || 'Analysis failed');
                }
            } catch (error) {
                console.error('Analysis error:', error);
                showError(`Analysis failed: ${error.message}`);
            } finally {
                showLoading(false);
            }
        }

        // Display results with animations
        function displayResults(data) {
            const results = document.getElementById('results');
            results.style.display = 'block';
            results.scrollIntoView({ behavior: 'smooth' });

            // Calculate overall score
            const scores = Object.values(data.metrics);
            const avgScore = scores.reduce((a, b) => a + b, 0) / scores.length;
            
            // Animate score circle
            const scoreCircle = document.getElementById('scoreCircle');
            const scoreText = document.getElementById('scoreText');
            const percentage = (avgScore / 10) * 100;
            
            // Animate the score text
            let currentScore = 0;
            const targetScore = Math.round(avgScore);
            const increment = targetScore / 50;
            
            const scoreAnimation = setInterval(() => {
                currentScore += increment;
                if (currentScore >= targetScore) {
                    currentScore = targetScore;
                    clearInterval(scoreAnimation);
                }
                scoreText.textContent = Math.round(currentScore);
            }, 20);
            
            // Animate the circle
            scoreCircle.style.background = `conic-gradient(from 0deg, #00d4ff 0deg, #00d4ff ${percentage * 3.6}deg, #333333 ${percentage * 3.6}deg)`;

            // Display parameters with staggered animation
            const parametersGrid = document.getElementById('parametersGrid');
            parametersGrid.innerHTML = '';

            Object.entries(data.metrics).forEach(([key, value], index) => {
                setTimeout(() => {
                    const card = document.createElement('div');
                    card.className = 'parameter-card';
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(20px)';
                    card.innerHTML = `
                        <div class="parameter-name">${key.charAt(0).toUpperCase() + key.slice(1)}</div>
                        <div class="parameter-score">${Math.round(value)}/10</div>
                    `;
                    parametersGrid.appendChild(card);
                    
                    // Animate in
                    setTimeout(() => {
                        card.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0)';
                    }, 50);
                }, index * 50);
            });

            // Display AI insights
            if (data.aiInsights) {
                const aiInsights = document.getElementById('aiInsights');
                aiInsights.style.opacity = '0';
                aiInsights.innerHTML = `
                    <h3>🤖 AI Insights</h3>
                    <p>${data.aiInsights}</p>
                `;
                setTimeout(() => {
                    aiInsights.style.transition = 'opacity 0.5s ease';
                    aiInsights.style.opacity = '1';
                }, 1000);
            }

            // Display word suggestions
            if (data.wordSuggestions && data.wordSuggestions.length > 0) {
                displayWordSuggestions(data.wordSuggestions);
            }
        }

        // Display word suggestions with animations
        function displayWordSuggestions(suggestions) {
            const container = document.getElementById('wordSuggestions');
            container.innerHTML = '<h3>💡 Word Suggestions</h3>';

            suggestions.forEach((suggestion, index) => {
                setTimeout(() => {
                    const item = document.createElement('div');
                    item.className = 'suggestion-item';
                    item.style.opacity = '0';
                    item.style.transform = 'translateX(-20px)';
                    item.innerHTML = `
                        <div class="suggestion-header">
                            <span class="suggestion-category">${suggestion.category}</span>
                            <span class="suggestion-impact">${suggestion.impact}</span>
                        </div>
                        <div class="suggestion-content">
                            <span class="original-word">"${suggestion.original}"</span> → 
                            <span class="suggested-words">"${suggestion.suggestions.join('", "')}"</span>
                        </div>
                        <div class="suggestion-reason">${suggestion.reason}</div>
                        <div class="suggestion-actions">
                            <button class="btn btn-small" onclick="applySuggestion('${suggestion.original}', '${suggestion.suggestions[0]}')">
                                Apply First
                            </button>
                            <button class="btn btn-small btn-secondary" onclick="showAllSuggestions('${suggestion.original}')">
                                View All
                            </button>
                        </div>
                    `;
                    container.appendChild(item);
                    
                    // Animate in
                    setTimeout(() => {
                        item.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                        item.style.opacity = '1';
                        item.style.transform = 'translateX(0)';
                    }, 50);
                }, index * 100);
            });
        }

        // Apply word suggestion with animation
        function applySuggestion(original, replacement) {
            const textarea = document.getElementById('copyText');
            const text = textarea.value;
            const newText = text.replace(new RegExp(original, 'gi'), replacement);
            textarea.value = newText;
            
            // Animate the change
            textarea.style.borderColor = '#00ff88';
            textarea.style.boxShadow = '0 0 0 4px rgba(0, 255, 136, 0.2)';
            setTimeout(() => {
                textarea.style.borderColor = '';
                textarea.style.boxShadow = '';
            }, 1000);
            
            // Update word count
            const words = newText.trim().split(/\s+/).filter(word => word.length > 0);
            document.getElementById('wordCount').textContent = `${words.length} words`;
        }

        // Humanize copy with proper error handling
        async function humanizeCopy() {
            const copyText = document.getElementById('copyText').value.trim();
            const copyType = document.getElementById('copyType').value;

            if (!copyText) {
                showError('Please enter some copy to humanize');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch('/api/humanize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        copyText, 
                        copyType, 
                        tone: selectedTone,
                        useModel: 'openai'
                    })
                });

                // Handle non-JSON responses
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    throw new Error(`Server error: ${text.substring(0, 200)}`);
                }

                const data = await response.json();

                if (data.success) {
                    displayHumanizedVersion(data);
                } else {
                    throw new Error(data.error || 'Humanization failed');
                }
            } catch (error) {
                console.error('Humanization error:', error);
                showError(`Humanization failed: ${error.message}`);
            } finally {
                showLoading(false);
            }
        }

        // Display humanized version with animations
        function displayHumanizedVersion(data) {
            const humanizeSection = document.getElementById('humanizeSection');
            const humanizedText = document.getElementById('humanizedText');
            const humanizeImprovements = document.getElementById('humanizeImprovements');

            humanizedText.innerHTML = `
                <h3>✨ Humanized Copy</h3>
                <p>${data.humanizedText}</p>
            `;

            if (data.improvements && data.improvements.length > 0) {
                humanizeImprovements.innerHTML = `
                    <h3>🔧 Improvements Made</h3>
                    <ul>
                        ${data.improvements.map(improvement => `<li>${improvement}</li>`).join('')}
                    </ul>
                `;
            }

            humanizeSection.style.display = 'block';
            humanizeSection.scrollIntoView({ behavior: 'smooth' });
            
            // Animate in
            humanizeSection.style.opacity = '0';
            humanizeSection.style.transform = 'translateY(20px)';
            setTimeout(() => {
                humanizeSection.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                humanizeSection.style.opacity = '1';
                humanizeSection.style.transform = 'translateY(0)';
            }, 100);
        }

        // Show error message with animation
        function showError(message) {
            const results = document.getElementById('results');
            results.style.display = 'block';
            results.innerHTML = `
                <div class="error-message">
                    <h3>❌ Error</h3>
                    <p>${message}</p>
                    <p>Please check your API keys in the admin panel or try again later.</p>
                </div>
            `;
            results.scrollIntoView({ behavior: 'smooth' });
        }

        // Clear all with animation
        function clearAll() {
            const results = document.getElementById('results');
            const humanizeSection = document.getElementById('humanizeSection');
            
            // Animate out
            results.style.transition = 'all 0.3s ease';
            results.style.opacity = '0';
            results.style.transform = 'translateY(-20px)';
            
            setTimeout(() => {
                document.getElementById('copyText').value = '';
                document.getElementById('wordCount').textContent = '0 words';
                results.style.display = 'none';
                humanizeSection.style.display = 'none';
                results.style.opacity = '';
                results.style.transform = '';
                currentAnalysis = null;
            }, 300);
        }

        // Show/hide loading with animation
        function showLoading(show) {
            const loading = document.getElementById('loading');
            if (show) {
                loading.style.display = 'block';
                loading.style.opacity = '0';
                setTimeout(() => {
                    loading.style.transition = 'opacity 0.3s ease';
                    loading.style.opacity = '1';
                }, 50);
            } else {
                loading.style.transition = 'opacity 0.3s ease';
                loading.style.opacity = '0';
                setTimeout(() => {
                    loading.style.display = 'none';
                }, 300);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Set default tone
            document.querySelector('.humanize-option').classList.add('selected');
            
            // Add entrance animation
            const cards = document.querySelectorAll('.glass-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(30px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 200);
            });
        });
    </script>
</body>
</html>
